<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USF India - Contact page</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(180deg, #b0c4de 0%, #e6f2ff 100%); 
            color: #2c3e50; 
            min-height: 100vh;
        }
        .site-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        header {
            background-color: #ffffff;
            padding: 15px 25px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 500;
            color: #2c5282;
        }
        .banner-container {
            width: 100%;
            height: 320px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #ced4da;
        }
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 20px;
            align-items: start;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            text-align: left;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            border: 1px solid #3182ce;
        }
        .nav-btn.active {
            background-color: #ffffff;
            color: #2c5282;
            border: 1px solid #ced4da;
            font-weight: bold;
        }
        .nav-btn.blue-btn {
            background-color: #4a90e2;
            color: white;
        }
        .nav-btn.blue-btn:hover {
            background-color: #357abd;
        }
        .main-card {
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .main-card h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: normal;
            color: #2c5282;
        }
        
        /* Form Field Styling mirroring SimDif original layout */
        .form-container {
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 25px;
            margin-top: 10px;
        }
        .form-container h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: #4a5568;
            font-weight: normal;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #4a5568;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background-color: #ffffff;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 1px #3182ce;
        }
        .submit-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #357abd;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="site-wrapper">
        
        <header>
            <h1>United Students Foundation USF</h1>
        </header>

        <div class="banner-container">
            <img class="banner-img" src="images/banner.jpg" onerror="this.src='https://unsplash.com'" alt="USF Beach Banner">
        </div>

        <div class="content-grid">
            
            <!-- Left Side Navbar -->
            <nav class="sidebar">
                <a href="index.html" class="nav-btn blue-btn">Home page</a>
                <a href="more.html" class="nav-btn blue-btn">More</a>
                <a href="contact.html" class="nav-btn active">Contact page</a>
                <a href="preamble.html" class="nav-btn blue-btn">Preamble</a>
                <a href="code-language.html" class="nav-btn blue-btn">USF code language</a>
            </nav>

            <!-- Main Form Card Section -->
            <main class="main-card">
                
                <h2>Contact page</h2>

                <div class="form-container">
                    <h3>Contact us by Email</h3>
                    
                    <!-- Form actions point to Formspree endpoint. Replace 'YOUR_FORM_ID' later if you want real emails -->
                    <form action="https://formspree.io" method="POST">
                        <div class="form-group">
                            <label for="email">Your Email address:</label>
                            <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
                        </div>

                        <div class="form-group">
                            <label for="subject">The subject of your message:</label>
                            <input type="text" id="subject" name="subject" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Your message:</label>
                            <textarea id="message" name="message" rows="6" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Send message</button>
                    </form>
                </div>

            </main>

        </div>
    </div>

</body>
</html>
